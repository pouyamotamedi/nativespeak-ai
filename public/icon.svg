<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Center Circle Glow -->
  <circle cx="256" cy="256" r="170" fill="white" fill-opacity="0.08" />

  <!-- Audio Wave Speech Graphic inside Safe Zone -->
  <g filter="url(#shadow)" transform="translate(106, 126)">
    <!-- Speech Bubble Outline / Backdrop -->
    <path d="M 150 0 C 67.157 0 0 62.68 0 140 C 0 183.33 21.05 222.18 54.55 248.65 C 50.8 268.45 40.5 289.8 22.8 304.5 C 20.3 306.6 21.4 310.8 24.6 311.2 C 57.5 315.8 98.7 301.2 125.6 276.4 C 133.5 278.8 141.6 280 150 280 C 232.84 280 300 217.32 300 140 C 300 62.68 232.84 0 150 0 Z" fill="#1e1b4b" fill-opacity="0.6" />
    
    <!-- Sound Waves / Voice Bars -->
    <rect x="75" y="110" width="14" height="60" rx="7" fill="url(#wave)" />
    <rect x="105" y="80" width="14" height="120" rx="7" fill="url(#wave)" />
    <rect x="135" y="55" width="14" height="170" rx="7" fill="#38bdf8" />
    <rect x="165" y="70" width="14" height="140" rx="7" fill="url(#wave)" />
    <rect x="195" y="100" width="14" height="80" rx="7" fill="url(#wave)" />
    <rect x="225" y="125" width="14" height="30" rx="7" fill="url(#wave)" />

    <!-- Little American Star Accent -->
    <path d="M 235 60 L 238 70 L 248 70 L 240 76 L 243 86 L 235 80 L 227 86 L 230 76 L 222 70 L 232 70 Z" fill="#fbbf24" />
  </g>
</svg>
